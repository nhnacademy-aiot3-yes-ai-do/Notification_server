name: Setup test env
description: Notification Service CI 테스트용 PostgreSQL 환경변수 설정
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        
        # PostgreSQL
        echo "DB_HOST=localhost" >> "$GITHUB_ENV"
        echo "DB_PORT=5432" >> "$GITHUB_ENV"
        echo "DB_NAME=testdb" >> "$GITHUB_ENV"
        echo "DB_USERNAME=test" >> "$GITHUB_ENV"
        echo "DB_PASSWORD=test1234" >> "$GITHUB_ENV"
        # application.yml uses this exact, case-sensitive variable name.
        echo "NOTIFICATION_DB_SCHEMA=public" >> "$GITHUB_ENV"
        
        # RabbitMQ
        echo "RABBITMQ_HOST=localhost" >> "$GITHUB_ENV"
        echo "RABBITMQ_PORT=5672" >> "$GITHUB_ENV"
        echo "RABBITMQ_USERNAME=test" >> "$GITHUB_ENV"
        echo "RABBITMQ_PASSWORD=test1234" >> "$GITHUB_ENV"

        # Disable external service discovery in CI.
        echo "K8S_DISCOVERY_ENABLED=false" >> "$GITHUB_ENV"
        echo "EUREKA_ENABLED=false" >> "$GITHUB_ENV"
        echo "EUREKA_URL=http://localhost:8761/eureka/" >> "$GITHUB_ENV"
        echo "LOG_LEVEL=WARN" >> "$GITHUB_ENV"