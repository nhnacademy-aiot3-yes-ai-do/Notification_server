name: reusable-test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test1234
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - uses: ./.github/actions/setup-test-env
      - name: Test and coverage check
        run: >
          mvn -B
          -Dnotification.integration.enabled=true
          -Dnotification.integration.db-url=jdbc:postgresql://localhost:5432/testdb
          -Dnotification.integration.db-username=test
          -Dnotification.integration.db-password=test1234
          clean verify
