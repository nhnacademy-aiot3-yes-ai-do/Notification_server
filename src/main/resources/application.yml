spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: notification-server

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${NOTIFICATION_DB_SCHEMA}&stringtype=unspecified
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    postgresql:
      # CREATE INDEX CONCURRENTLY 마이그레이션이 Flyway의 트랜잭션 잠금과
      # 서로 기다리지 않도록 세션 수준 advisory lock을 사용한다.
      transactional-lock: false

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false

notification:
  provider:
    telegram:
      base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
      bot-token: ${TELEGRAM_BOT_TOKEN:}
    discord:
      allowed-hosts: ${DISCORD_ALLOWED_HOSTS:discord.com,discordapp.com}
  retry:
    backoff: ${NOTIFICATION_RETRY_BACKOFF:1s}
  recovery:
    pending-delivery-delay: ${NOTIFICATION_PENDING_DELIVERY_RECOVERY_DELAY:PT1M}
    pending-delivery-min-age: ${NOTIFICATION_PENDING_DELIVERY_MIN_AGE:PT30S}
    sending-claim-timeout: ${NOTIFICATION_SENDING_CLAIM_TIMEOUT:PT5M}
    pending-delivery-batch-size: ${NOTIFICATION_PENDING_DELIVERY_BATCH_SIZE:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # 외부 상태 상세(DB URL·브로커 정보 등)는 노출하지 않는다.
      show-details: never

logging:
  level:
    site.yesaido.notification_server: INFO
    org.flywaydb: INFO
