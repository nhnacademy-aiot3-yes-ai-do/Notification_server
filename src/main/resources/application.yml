spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: notification-server

  cloud:
    kubernetes:
      discovery:
        enabled: ${K8S_DISCOVERY_ENABLED:false}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${NOTIFICATION_DB_SCHEMA}&stringtype=unspecified
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        default-requeue-rejected: false

notification:
  rabbit:
    exchange: ${NOTIFICATION_EVENT_EXCHANGE:yes-nhn.notification.exchange}
    threshold:
      queue: ${NOTIFICATION_THRESHOLD_QUEUE:yes-nhn.notification.threshold.queue}
      routing-key: ${NOTIFICATION_THRESHOLD_ROUTING_KEY:yes-nhn.notification.threshold.queue}
    action:
      queue: ${NOTIFICATION_ACTION_QUEUE:yes-nhn.notification.action.queue}
      routing-key: ${NOTIFICATION_ACTION_ROUTING_KEY:yes-nhn.notification.action.queue}
    daily:
      queue: ${NOTIFICATION_DAILY_QUEUE:yes-nhn.notification.daily.queue}
      routing-key: ${NOTIFICATION_DAILY_ROUTING_KEY:yes-nhn.notification.daily.queue}
    login:
      queue: ${NOTIFICATION_LOGIN_QUEUE:yes-nhn.notification.login.queue}
      routing-key: ${NOTIFICATION_LOGIN_ROUTING_KEY:yes-nhn.notification.login.queue}
    question:
      queue: ${NOTIFICATION_QUESTION_QUEUE:yes-nhn.notification.question.queue}
      routing-key: ${NOTIFICATION_QUESTION_ROUTING_KEY:yes-nhn.notification.question.queue}
    answer:
      queue: ${NOTIFICATION_ANSWER_QUEUE:yes-nhn.notification.answer.queue}
      routing-key: ${NOTIFICATION_ANSWER_ROUTING_KEY:yes-nhn.notification.answer.queue}
    harvest:
      queue: ${NOTIFICATION_HARVEST_QUEUE:yes-nhn.notification.harvest.queue}
      routing-key: ${NOTIFICATION_HARVEST_ROUTING_KEY:yes-nhn.notification.harvest.queue}
    cultivation-finished:
      queue: ${NOTIFICATION_CULTIVATION_FINISHED_QUEUE:yes-nhn.notification.cultivation-finished.queue}
      routing-key: ${NOTIFICATION_CULTIVATION_FINISHED_ROUTING_KEY:yes-nhn.notification.cultivation-finished.queue}
    dead-letter-exchange: ${NOTIFICATION_DLX:yes-nhn.dlx}
    dead-letter-queue: ${NOTIFICATION_DLQ:yes-nhn.dlq}
    dead-letter-routing-key: ${NOTIFICATION_DLQ_ROUTING_KEY:yes-nhn.dlq}
  provider:
    telegram:
      base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
      bot-token: ${TELEGRAM_BOT_TOKEN:}
    discord:
      allowed-hosts: ${DISCORD_ALLOWED_HOSTS:discord.com,discordapp.com}
  retry:
    backoff: ${NOTIFICATION_RETRY_BACKOFF:1s}
  recovery:
    pending-delivery-delay: ${NOTIFICATION_PENDING_DELIVERY_RECOVERY_DELAY:PT1M}
    pending-delivery-min-age: ${NOTIFICATION_PENDING_DELIVERY_MIN_AGE:PT30S}
    sending-claim-timeout: ${NOTIFICATION_SENDING_CLAIM_TIMEOUT:PT5M}
    pending-delivery-batch-size: ${NOTIFICATION_PENDING_DELIVERY_BATCH_SIZE:100}

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # 외부 상태 상세(DB URL·브로커 정보 등)는 노출하지 않는다.
      show-details: never

logging:
  level:
    site.yesaido.notification_server: INFO
    org.flywaydb: INFO
