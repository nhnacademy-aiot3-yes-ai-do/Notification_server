spring:
  application:
    name: notification-server

  cloud:
    kubernetes:
      discovery:
        enabled: ${K8S_DISCOVERY_ENABLED:false}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        default-requeue-rejected: false

notification:
  rabbit:
    exchange: ${NOTIFICATION_EVENT_EXCHANGE:notification.events.exchange}
    queue: ${NOTIFICATION_EVENT_QUEUE:notification.event.queue}
    routing-key: ${NOTIFICATION_EVENT_ROUTING_KEY:notification.event.#}
    dead-letter-exchange: ${NOTIFICATION_DLX:notification.dlx}
    dead-letter-queue: ${NOTIFICATION_DLQ:notification.dlq}
    dead-letter-routing-key: ${NOTIFICATION_DLQ_ROUTING_KEY:notification.failed}
  provider:
    telegram:
      base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
      bot-token: ${TELEGRAM_BOT_TOKEN:}
    discord:
      allowed-hosts: ${DISCORD_ALLOWED_HOSTS:discord.com,discordapp.com}
  retry:
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:3}
    backoff: ${NOTIFICATION_RETRY_BACKOFF:1s}

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    site.yesaido.notification_server: INFO
    org.flywaydb: INFO
